---
- name: Add default gitignore
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ansible_user_dir }}/{{ item }}"
    mode: "0644"
  loop:
    - .gitignore

- name: Add gitconfig
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ ansible_user_dir }}/.gitconfig"
    mode: "0644"
