---
- name: MacOS configuration
  hosts: local

  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Include playbook configuration
      ansible.builtin.include_vars: "{{ item }}"
      with_fileglob:
        - "{{ playbook_dir }}/config.yml"
      tags: ['always']

  roles:
    - role: geerlingguy.mac.homebrew
      tags: ['homebrew']
    - role: geerlingguy.mac.mas
      when: mas_installed_apps or mas_installed_app_ids
      tags: ['mas']
    - role: geerlingguy.mac.dock
      when: configure_dock
      tags: ['dock']
    - role: dnsmasq
      tags: ['dnsmasq']
    - role: git
      tags: ['git']
    - role: php
      tags: ['php']

  tasks:
    - ansible.builtin.import_tasks: tasks/vscode.yml
      when: configure_vscode
      tags: ['vscode']

    - ansible.builtin.import_tasks: tasks/zsh.yml
      tags: ['shell', 'zsh']

    - ansible.builtin.import_tasks: tasks/xattr.yml
      tags: ['xattr']

    #  - ansible.builtin.import_tasks: tasks/colima.yml
    #   tags: ['colima']

    - ansible.builtin.import_tasks: tasks/ssh.yml
      tags: ['ssh']

    - ansible.builtin.import_tasks: tasks/dotfiles.yml
      tags: ['dotfiles']

    - ansible.builtin.import_tasks: tasks/github.yml
      tags: ['github']

    - ansible.builtin.import_tasks: tasks/sdkman.yml
      tags: ['devtools', 'sdkman']

    - ansible.builtin.import_tasks: tasks/nvm.yml
      tags: ['devtools', 'nvm']

    - name: Include defaults configuration task
      ansible.builtin.include_tasks:
        file: tasks/defaults.yml
        apply:
          tags: ["defaults"]
      loop: "{{ app_defaults_scripts }}"
      tags: ["defaults"]

    - ansible.builtin.import_tasks: tasks/osx-setup.yml
      tags: ['osx-setup']

    - name: Run post-provision task files
      tags: ['post']
      notify: Clear homebrew cache
      block:
        - name: Run configured post-provision ansible task files
          ansible.builtin.include_tasks: "{{ outer_item }}"
          loop_control:
            loop_var: outer_item
          with_fileglob: "{{ post_provision_tasks | default(omit) }}"
