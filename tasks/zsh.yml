---
- name: Get the path to ZSH
  ansible.builtin.command:
    cmd: which zsh
  become: false
  register: zsh_path

- name: Ensure homebrew zsh is in allowed shells
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ zsh_path.stdout }}"
  become: true

- name: Set ZSH as the default shell
  ansible.builtin.shell:
    cmd: chsh -s $(which zsh) {{ lookup('env', 'USER') }}
  become: true

- name: Create completion scripts directory
  ansible.builtin.file:
    path: "{{ zsh_completions_dir }}"
    state: directory

- name: Create zsh configs from templates
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ playbook_dir }}/files/zsh/{{ item | regex_replace('\\.j2$', '') }}"
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_gid }}"
  loop:
    - zshrc.j2
    - zprofile.j2

- name: Link zsh configs
  ansible.builtin.include_role:
    name: symlink
  vars:
    symlink_src: "{{ playbook_dir }}/files/zsh/{{ item }}"
    symlink_dst: "{{ ansible_user_dir }}/.{{ item }}"
  loop:
    - zprofile
    - zshrc

- name: Link zsh imports
  ansible.builtin.include_role:
    name: symlink
  vars:
    symlink_src: "{{ playbook_dir }}/files/zsh/imports/{{ item }}"
    symlink_dst: "{{ ansible_user_dir }}/.zsh_{{ item }}"
  loop:
    - aliases
    - functions
