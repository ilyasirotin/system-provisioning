---
# Set to 'true' to configure the Dock via dockutil.
configure_dock: false
dockitems_remove: []
# - Launchpad
# - TV
# - Podcasts
# - 'App Store'
dockitems_persist: []
# - name: "Sublime Text"
#   path: "/Applications/Sublime Text.app/"
#   pos: 5

homebrew_cask_accept_external_apps: true
homebrew_clear_cache: true

homebrew_installed_packages:
  - autoconf
  - automake
  - make
  - gcc
  - bfg # Remove large files or passwords from Git history like git-filter-branch
  - coreutils
  - direnv # Load/unload environment variables based on $PWD
  - dnsmasq # Lightweight DNS forwarder and DHCP server
  - fzf # Command-line fuzzy finder written in Go
  - mcfly # Shell history search
  - gnu-time
  - htop
  - rcm # RC file (dotfile) management
  - readline # Library for command-line editing
  - tmux
  - vim
  - unzip
  - zlib
  - xz
  - universal-ctags
  - gpg
  - curl
  - httpie # User-friendly cURL replacement (command-line HTTP client)
  - nmap
  - pngpaste # Paste PNG into files
  - ssh-copy-id # Add a public key to a remote machine's authorized_keys file
  - readline # Library for command-line editing
  - openssl
  - pv # Monitor data's progress through a pipe
  - wget
  - wrk # HTTP benchmarking tool
  - iperf # Tool to measure maximum TCP and UDP bandwidth
  - tree
  - bat # Clone of cat(1) with syntax highlighting and Git integration
  - tldr # Simplified and community-driven man pages
  - jq
  - ncdu # NCurses Disk Usage
  - dive # Tool for exploring each layer in a docker image
  - gh
  - shellcheck
  - sha2
  # - watchman
  # - bash-completion
  # - doxygen
  # - gettext
  # - gifsicle
  # - siege
  # - tig
  # - libevent
  # - ripgrep

homebrew_taps: []

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - 1password # Requires additional configuration
  - google-chrome
  - firefox
  - iterm2 # Requires additional configuration
  - ngrok # Requires additional configuration
  - telegram
  - visual-studio-code # Requires additional configuration
  - vlc
  - launchcontrol
  - aldente # Requires additional configuration
  - tg-pro # Requires additional configuration
  - mos # Requires additional configuration
  - jetbrains-toolbox # Requires additional configuration
  - logi-options+
  - obsidian # Requires additional configuration
  - spotify
  - qbittorrent
  - crossover
  - docker # Requires additional configuration
  - handbrake
  - cyberduck
  - mullvadvpn
  - xnconvert
  - postman

# See `geerlingguy.mas` role documentation for usage instructions.
mas_installed_apps:
  - { id: 497799835, name: "Xcode" }
  - { id: 462054704, name: "Microsoft Word" }
  - { id: 462058435, name: "Microsoft Excel" }
  - { id: 462062816, name: "Microsoft PowerPoint" }
  - { id: 985367838, name: "Microsoft Outlook" }

mas_uninstalled_apps:
  - { id: 682658836, name: "GarageBand" }

# Wheter install VSCode plugins and set pre-defined settings templates.
configure_vscode: true
vscode_extension_dir: "~/.vscode/extensions"
vscode_extensions:
  - redhat.ansible
  - redhat.vscode-xml
  - redhat.vscode-yaml
  - ms-vscode.cmake-tools
  - ms-vscode.cpptools-extension-pack
  - ms-azuretools.vscode-docker
  - ms-vscode.hexeditor
  - ms-vscode.makefile-tools
  - ms-python.vscode-pylance
  - ms-python.python
  - ms-python.debugpy
  - wholroyd.jinja
  - ms-vscode-remote.vscode-remote-extensionpack
  - ms-vscode-remote.remote-ssh-edit
  - ms-vscode.remote-explorer
  - ms-vscode.vscode-serial-monitor
  - monokai.theme-monokai-pro-vscode
  - dan-c-underwood.arm
  - alefragnani.bookmarks
  - twxs.cmake
  - vadimcn.vscode-lldb
  - firefox-devtools.vscode-firefox-debug
  - mikestead.dotenv
  - usernamehw.errorlens
  - dbaeumer.vscode-eslint
  - eamodio.gitlens
  - yzhang.markdown-all-in-one
  - yzane.markdown-pdf
  - esbenp.prettier-vscode
  - mechatroner.rainbow-csv
  - timonwong.shellcheck
  - jock.svg
  - gruntfuggly.todo-tree
  - mshr-h.veriloghdl
  - gediminaszlatkus.ctags-companion

osx_script: "~/.osx --no-restart"
